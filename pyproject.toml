[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mackolik-mcp"
version = "0.1.0"
description = "Unofficial read-only MCP server for mackolik.com live scores (live scores, results, fixtures, standings, match detail)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "mcp<2",
    "curl-cffi>=0.7,<1.0",
]
authors = [{ name = "Mohammad Abbasi" }]

[project.scripts]
mackolik-mcp = "mackolik_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mackolik_mcp"]
